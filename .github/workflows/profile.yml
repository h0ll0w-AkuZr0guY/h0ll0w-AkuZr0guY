name: Build profile from config

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.config.yml
      - content/public-memories.yml
      - scripts/**
      - package.json
      - package-lock.json
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: profile-generator
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out profile repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install generator dependencies
        run: npm ci

      - name: Generate bilingual profile and SVG assets
        run: npm run generate

      - name: Verify deterministic output
        run: npm test

      - name: Check generated diff for whitespace errors
        run: git diff --check

      - name: Commit generated files when configuration changed
        shell: bash
        run: |
          if git diff --quiet -- README.md README.zh-CN.md assets/generated; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh-CN.md assets/generated
          git commit -m "chore: regenerate profile"
          git push
