name: Refresh public profile metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}

    steps:
      - name: Keep the checked-in fallback when no token is configured
        if: env.METRICS_TOKEN == ''
        run: echo "METRICS_TOKEN is not configured; keeping the last local snapshot."

      - name: Generate local public metrics snapshot
        if: env.METRICS_TOKEN != ''
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ env.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: assets/snapshots/metrics.svg
          committer_message: "chore: refresh public profile metrics"
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Shanghai
          config_theme: transparent
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_followup: yes
          plugin_followup_sections: repositories
