current_questions:
  - en: How can an autonomous agent make permissions, evidence, and acceptance boundaries explicit?
    zh: Agent 自主执行任务时，怎样把权限、证据与验收边界变成显式协议？
  - en: How can semantic space and source relationships expose RAG errors that merely look correct?
    zh: 怎样用语义空间与来源关系识别 RAG 中“看起来正确”的错误？
  - en: As code becomes abundant, how should human advantage shift toward framing, constraints, and verification?
    zh: 当代码生成变得充裕，人的优势怎样转向问题定义、约束与验证设计？

