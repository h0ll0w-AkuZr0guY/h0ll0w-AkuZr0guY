pillars:
  - title:
      en: Reliable AI
      zh: 可靠 AI
    body:
      en: Retrieved evidence, semantic geometry, and feedback-driven checks for low-confidence outputs.
      zh: 用检索证据、语义几何与反馈式检查识别低置信输出。
  - title:
      en: Auditable Agents
      zh: 可审计 Agent
    body:
      en: Goals, permissions, evidence, and acceptance criteria expressed as workflow contracts.
      zh: 把目标、权限、证据与验收条件写成工作流合同。
  - title:
      en: Knowledge Infrastructure
      zh: 知识基础设施
    body:
      en: Notes, experiments, projects, and decisions organized into systems that can keep growing.
      zh: 把笔记、实验、项目与判断组织成可以持续生长的系统。

projects:
  - id: chronicle
    name: Chronicle Memory
    featured: true
    demo_link: chronicle_demo
    deployment_link: chronicle_deployment
    source_link: chronicle_source
    promise:
      en: Put today on the page, so your future self can still find it.
      zh: 把今天贴上来，让未来的你仍能找到它。
    description:
      en: A private, evidence-grounded personal journal. Photos, words, moods, time, and stories live on a freeform notebook while every AI-organized memory remains traceable to its source.
      zh: 一款私密、证据可追溯的个人手账。照片、文字、心情、时间与故事落在自由画布上，每一份 AI 整理仍能回到原始材料。
    status:
      en: Public, sanitized web experience backed by a privately deployed memory service.
      zh: 公开脱敏的 Web 体验，由私有化部署的记忆服务提供后端能力。
  - id: scholarflow
    name: ScholarFlow
    demo_link: scholarflow_demo
    source_link: scholarflow_source
    description:
      en: A local-first research planning assistant that turns an ambiguous topic into evidence, experiments, claims, and testable stage contracts.
      zh: 本地优先的科研规划助手，把模糊课题拆成证据、实验、主张与可验收的阶段合同。
  - id: atlas
    name: Aiznoyer Atlas
    demo_link: atlas
    source_link: atlas_source
    description:
      en: A searchable knowledge garden connecting years of notes, research writing, algorithms, and project records.
      zh: 一座连接多年笔记、研究写作、算法练习与项目记录的可搜索知识花园。
  - id: let-code
    name: Let Code in Pad
    demo_link: let_code
    description:
      en: An offline-first knowledge tool for deep desktop authoring and lightweight tablet review.
      zh: 面向电脑深度录入与平板轻量复习的离线优先知识工具。

