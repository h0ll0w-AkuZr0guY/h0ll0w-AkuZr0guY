<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">Zhiyuan's Living Memory Lab</title>
  <desc id="description">A research notebook connected to evidence, memory, and trustworthy AI systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111F"/>
      <stop offset="1" stop-color="#0D1B2A"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#68E0CF"/>
      <stop offset=".52" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#FF9E73"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8FA7C2" stroke-opacity=".10"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
    .eyebrow { font-size: 16px; letter-spacing: 3px; fill: #68E0CF; }
    .name { font-size: 60px; font-weight: 760; fill: #E7F0FF; }
    .tagline { font-size: 22px; fill: #8FA7C2; }
    .label { font-size: 14px; fill: #8FA7C2; letter-spacing: 1px; }
    .paper { font-size: 13px; fill: #3D4652; }

  </style>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <circle cx="1080" cy="62" r="124" fill="#A78BFA" opacity=".08"/>
  <circle cx="980" cy="390" r="156" fill="#68E0CF" opacity=".06"/>

  <g transform="translate(66 80)">
    <text class="eyebrow" y="0">LIVING MEMORY LAB / 01</text>
    <text class="name" y="78">Zhiyuan</text>
    <text class="tagline" y="126">Reliable AI · Auditable Agents</text>
    <text class="tagline" y="160">Knowledge Infrastructure</text>
    <path class="trace" d="M0 218 C160 170 245 282 414 222 S676 190 770 236" fill="none" stroke="url(#signal)" stroke-width="3" opacity=".92"/>
    <g transform="translate(0 252)">
      <circle class="pulse" cx="8" cy="8" r="8" fill="#68E0CF"/>
      <text class="label" x="28" y="13">QUESTION</text>
      <circle class="pulse" cx="152" cy="8" r="8" fill="#A78BFA"/>
      <text class="label" x="172" y="13">EVIDENCE</text>
      <circle class="pulse" cx="316" cy="8" r="8" fill="#FF9E73"/>
      <text class="label" x="336" y="13">MEMORY</text>
    </g>
  </g>

  <g class="float-a" transform="translate(790 58) rotate(-3 145 135)">
    <rect width="292" height="270" rx="16" fill="#F3EBDD"/>
    <rect x="22" y="22" width="248" height="112" rx="9" fill="#07111F" opacity=".84"/>
    <circle cx="66" cy="68" r="22" fill="#68E0CF" opacity=".85"/>
    <path d="M24 118l62-48 46 34 50-48 86 62" fill="none" stroke="#A78BFA" stroke-width="5" opacity=".72"/>
    <text class="paper" x="24" y="168">2026 / MEMORY SHARD</text>
    <text class="paper" x="24" y="198">keep the path back to</text>
    <text class="paper" x="24" y="220">what actually happened.</text>
    <path d="M24 242h162" stroke="#FF9E73" stroke-width="3"/>
  </g>
  <g class="float-b" transform="translate(1020 258) rotate(5)">
    <rect width="120" height="78" rx="12" fill="#0D1B2A" stroke="#68E0CF" stroke-opacity=".7"/>
    <text class="label" x="18" y="32">TRACE</text>
    <text class="label" x="18" y="54">VERIFIED</text>
  </g>
</svg>
